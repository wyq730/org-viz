<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组织图谱 · Org Atlas</title>
  <link rel="stylesheet" href="web/styles.css">
</head>
<body>
  <header>
    <a class="brand" href="./index.html"><span class="brand-icon">⌘</span><span>组织图谱<small>ORG ATLAS</small></span></a>
    <div class="search-area">
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索姓名，探索组织…" autocomplete="off" role="combobox" aria-label="搜索节点姓名" aria-autocomplete="list" aria-controls="results" aria-expanded="false"><kbd>⌘ K</kbd></label>
      <div id="results" role="listbox" aria-label="搜索结果" hidden></div>
    </div>
    <button id="open-file" class="primary">↥ 导入 JSON</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </header>
  <main id="workspace">
    <div class="workspace-heading"><div class="eyebrow">YOUR PEOPLE, CONNECTED</div><h1 id="title">每一个连接，都清晰可见。</h1><p id="summary">从一份数据开始，探索完整的组织关系。</p></div>
    <svg id="canvas" tabindex="0" role="group" aria-label="组织树，拖动空白区域平移，滚轮缩放"><g id="scene"></g></svg>
    <section id="welcome">
      <div class="welcome-symbol">♧</div><h2>把组织关系，展开来看</h2><p>拖入节点 JSON 文件，或选择文件导入。<br>多棵树、层级关系与人员详情，一眼掌握。</p>
      <div class="welcome-actions"><button id="choose-file" class="primary">选择 JSON 文件</button><button id="demo">试用演示数据 →</button></div>
      <small>文件仅在当前浏览器中读取 · 无需上传</small>
    </section>
    <div id="drop-overlay" hidden>松开以载入组织数据</div>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <div class="bottom-bar"><span id="hint">拖动画布平移 · 滚轮缩放 · 点击节点查看详情</span><div class="controls" aria-label="视图控制"><button id="expand-all" title="展开所有层级并适应视图" disabled>全部展开</button><button id="collapse-all" title="收起所有下级，仅保留根节点" disabled>全部折叠</button><span class="divider"></span><button id="zoom-out" aria-label="缩小">−</button><button id="reset-zoom" title="恢复 100%">100%</button><button id="zoom-in" aria-label="放大">＋</button><span class="divider"></span><button id="fit" title="适应全部已展开节点">适应视图</button></div></div>
    <aside id="details" role="dialog" aria-labelledby="detail-name" hidden><button id="close-details" aria-label="关闭详情">×</button><div class="eyebrow">NODE DETAILS</div><h2 id="detail-name"></h2><p id="detail-abstract"></p><dl id="detail-fields"></dl></aside>
  </main>
  <script src="web/app.js"></script>
</body>
</html>
